<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إبداعات هندسية | استوديو القوالب النفسية الخمسة والكاروسيل الموثق (E540 v2.0)</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0B132B;
      --navy2: #13203A;
      --alabaster: #FBF9F5;
      --orange: #E87722;
      --gold: #C59B27;
      --emerald: #10B981;
      --crimson: #E63946;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
    header {
      background: #13203A;
      border-bottom: 2px solid var(--gold);
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-badge {
      background: linear-gradient(135deg, #C59B27, #E87722);
      color: #0B132B;
      font-weight: 900;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 15px;
    }
    .workspace {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 24px;
      padding: 24px;
      flex: 1;
    }
    @media (max-width: 1024px) { .workspace { grid-template-columns: 1fr; } }
    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    label { font-size: 13px; font-weight: 700; color: #cbd5e1; display: block; margin-bottom: 4px; }
    select, input, textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
    }
    textarea { min-height: 76px; resize: vertical; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-weight: 800;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--orange); color: #fff; flex: 1; }
    .btn-primary:hover { background: #d46514; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .preview-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #1e293b;
    }
    canvas {
      max-width: 100%;
      height: auto;
      max-height: 78vh;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-badge">E540 v2.0</span>
      <div>
        <h1 style="font-size: 19px; font-weight: 900;">إبداعات هندسية — استوديو القوالب النفسية الخمسة الموثقة</h1>
        <p style="font-size: 12px; color: #94a3b8;">م. عبدالمجيد الفقيه | مطابقة كود البناء السعودي (SBC) ووسوم التحقق الرسمية</p>
      </div>
    </div>
    <div style="font-size: 13px; color: #fbbf24; font-weight: 700;">الأبعاد القياسية: 1080 × 1350 (4:5)</div>
  </header>

  <main class="workspace">
    <section class="panel">
      <div>
        <label>1. اختر القالب البصري النفسي (Archetype):</label>
        <select id="archetypeSelect">
          <option value="SPLIT_COMPARISON">المقارنة النصفية الحاسمة (الخطأ ❌ مقابل الصح ✅ — نهاري مريح)</option>
          <option value="X_RAY_LENS">عدسة الأشعة السينية (X-Ray Lens — كشف الخفايا ليلي فخم)</option>
          <option value="FINANCIAL_ICEBERG">جبل الجليد المالي والتعاقدي (Iceberg — الـ 75% المخفية)</option>
          <option value="MACRO_BENTO">بطاقات البنتو الميكروية (Apple Bento UI — 3 بطاقات مركزة)</option>
        </select>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div>
          <label>السلسلة التحريرية:</label>
          <select id="seriesSelect">
            <option value="#من_الموقع">#من_الموقع</option>
            <option value="#المقاول_الذكي">#المقاول_الذكي</option>
            <option value="#مكة_تبني">#مكة_تبني</option>
            <option value="#قبل_أن_توقع">#قبل_أن_توقع</option>
            <option value="#بوابة_الجودة">#بوابة_الجودة</option>
            <option value="#هندسة_بالأرقام">#هندسة_بالأرقام</option>
          </select>
        </div>
        <div>
          <label>وسم التحقق والمرجع (وثيقة 09):</label>
          <select id="verificationBadge">
            <option value="[حقيقة رسمية] كود البناء السعودي SBC 304">[حقيقة رسمية] كود SBC 304</option>
            <option value="[حقيقة رسمية] كود البناء السكني SBC 1101">[حقيقة رسمية] كود SBC 1101</option>
            <option value="[حقيقة رسمية] كود التربة والأساسات SBC 303">[حقيقة رسمية] كود SBC 303</option>
            <option value="[تحليل هندسي] عقود الهيئة السعودية للمقاولين">[تحليل هندسي] عقود المقاولين SCA</option>
            <option value="[تقدير توضيحي] دراسة جدوى وتكاليف ميدانية">[تقدير توضيحي] دراسة تكاليف</option>
          </select>
        </div>
      </div>

      <div>
        <label>العنوان الخاطف (Hook Title — يُقرأ في 3 ثوانٍ):</label>
        <input id="hookTitle" type="text" value="خطأ واحد في الدفان.. يدمّر أرضيات بيتك بالكامل!" />
      </div>

      <div>
        <label>العنوان الفرعي المفسر (Subtitle):</label>
        <input id="subTitle" type="text" value="لماذا يهبط بلاط الدور الأرضي بعد سنة واحدة من السكن؟" />
      </div>

      <div>
        <label>البطاقة الأولى (الخطأ الكارثي ❌ أو الخطر الأول):</label>
        <textarea id="card1Text">الدفان العشوائي الخاطئ: ردم مخلفات البناء والصخور دفعة واحدة بدون رش ولا رصاصة ميكانيكية يسبب هبوط البلاط حتماً.</textarea>
      </div>

      <div>
        <label>البطاقة الثانية (الحل الهندسي المعتمد ✅ أو الحقيقة الثانية):</label>
        <textarea id="card2Text">الدفان الهندسي الصحيح: فرش صبيز نظيف على طبقات لا تتجاوز 25 سم مع الرش الغزير والدمك الميكانيكي باختبار 95%.</textarea>
      </div>

      <div>
        <label>القاعدة الذهبية / البطاقة الثالثة:</label>
        <textarea id="card3Text">القاعدة الهندسية: وفّر في الديكورات كما تشاء.. لكن لا تتهاون أبداً في دمك التربة وعزل القواعد تحت بيتك!</textarea>
      </div>

      <div>
        <label>سؤال تحفيز التفاعل في الشريط السفلي (Engagement CTA):</label>
        <input id="ctaQuestion" type="text" value="سؤال للملاك: هل استلمتم اختبار دكّ التربة (95%) قبل صبة النظافة؟" />
      </div>

      <div class="btn-row">
        <button class="btn-primary" id="renderBtn">تحديث التصميم البصري</button>
        <button class="btn-secondary" id="downloadBtn">تحميل PNG (1080×1350)</button>
      </div>
    </section>

    <section class="preview-area">
      <canvas id="slideCanvas" width="1080" height="1350"></canvas>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('slideCanvas');
    const ctx = canvas.getContext('2d');

    function wrapArabicText(context, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let currentY = y;
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = context.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          context.fillText(line.trim(), x, currentY);
          line = words[n] + ' ';
          currentY += lineHeight;
        } else {
          line = testLine;
        }
      }
      context.fillText(line.trim(), x, currentY);
      return currentY + lineHeight;
    }

    function drawRoundedRect(ctx, x, y, w, h, r, fill, stroke, strokeWidth = 2) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = strokeWidth; ctx.stroke(); }
    }

    function renderSlide() {
      const arch = document.getElementById('archetypeSelect').value;
      const series = document.getElementById('seriesSelect').value;
      const badge = document.getElementById('verificationBadge').value;
      const hook = document.getElementById('hookTitle').value;
      const sub = document.getElementById('subTitle').value;
      const c1 = document.getElementById('card1Text').value;
      const c2 = document.getElementById('card2Text').value;
      const c3 = document.getElementById('card3Text').value;
      const cta = document.getElementById('ctaQuestion').value;

      const isLight = (arch === 'SPLIT_COMPARISON' || arch === 'MACRO_BENTO');
      ctx.fillStyle = isLight ? '#FBF9F5' : '#0B132B';
      ctx.fillRect(0, 0, 1080, 1350);

      // Subtle architectural grid
      ctx.strokeStyle = isLight ? 'rgba(19, 32, 58, 0.04)' : 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 1080; i += 60) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 1350); ctx.stroke();
      }
      for (let j = 0; j < 1350; j += 60) {
        ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(1080, j); ctx.stroke();
      }

      // Top Header Badges
      drawRoundedRect(ctx, 720, 48, 300, 54, 27, isLight ? '#13203A' : '#1C2E4A', '#C59B27', 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '800 22px Cairo';
      ctx.textAlign = 'center';
      ctx.fillText('إبداعات هندسية | E540', 870, 83);

      drawRoundedRect(ctx, 60, 48, 430, 54, 27, isLight ? 'rgba(16,185,129,0.12)' : 'rgba(16,185,129,0.2)', '#10B981', 2);
      ctx.fillStyle = isLight ? '#065F46' : '#6EE7B7';
      ctx.font = '700 19px Cairo';
      ctx.fillText(badge + ' | ' + series, 275, 83);

      // Main Hook Title
      ctx.fillStyle = isLight ? '#0B132B' : '#FFFFFF';
      ctx.font = '900 50px Cairo';
      ctx.textAlign = 'center';
      let nextY = wrapArabicText(ctx, hook, 540, 185, 940, 72);

      // Subtitle
      ctx.fillStyle = '#E87722';
      ctx.font = '700 30px Cairo';
      nextY = wrapArabicText(ctx, sub, 540, nextY + 10, 920, 48);

      // Archetype Body Layout
      const bodyTop = Math.max(nextY + 35, 360);
      if (arch === 'SPLIT_COMPARISON') {
        drawRoundedRect(ctx, 555, bodyTop, 465, 520, 28, '#FFF5F5', '#E63946', 3);
        drawRoundedRect(ctx, 595, bodyTop + 28, 385, 60, 30, '#E63946', null);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 26px Cairo';
        ctx.fillText('❌ الممارسة الخاطئة بالموقع', 787, bodyTop + 68);

        ctx.fillStyle = '#1E293B';
        ctx.font = '700 28px Cairo';
        ctx.textAlign = 'right';
        wrapArabicText(ctx, c1, 985, bodyTop + 155, 395, 52);

        drawRoundedRect(ctx, 60, bodyTop, 465, 520, 28, '#F0FDF4', '#10B981', 3);
        drawRoundedRect(ctx, 100, bodyTop + 28, 385, 60, 30, '#10B981', null);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 26px Cairo';
        ctx.textAlign = 'center';
        ctx.fillText('✅ الأصول الهندسية المعتمدة', 292, bodyTop + 68);

        ctx.fillStyle = '#064E3B';
        ctx.font = '700 28px Cairo';
        ctx.textAlign = 'right';
        wrapArabicText(ctx, c2, 490, bodyTop + 155, 395, 52);

        drawRoundedRect(ctx, 60, bodyTop + 550, 960, 145, 24, '#FEF3C7', '#D97706', 2);
        ctx.fillStyle = '#78350F';
        ctx.font = '800 27px Cairo';
        ctx.textAlign = 'center';
        wrapArabicText(ctx, '💡 ' + c3, 540, bodyTop + 605, 900, 46);
      } else {
        const cards = [
          { text: c1, border: '#EF4444', bg: isLight ? '#FFFFFF' : 'rgba(239,68,68,0.12)', tag: '01' },
          { text: c2, border: '#F59E0B', bg: isLight ? '#FFFFFF' : 'rgba(245,158,11,0.12)', tag: '02' },
          { text: c3, border: '#10B981', bg: isLight ? '#FFFFFF' : 'rgba(16,185,129,0.12)', tag: '03' }
        ];
        cards.forEach((item, idx) => {
          const cy = bodyTop + idx * 230;
          drawRoundedRect(ctx, 60, cy, 960, 200, 24, item.bg, item.border, 3);
          drawRoundedRect(ctx, 910, cy + 30, 80, 80, 40, item.border, null);
          ctx.fillStyle = '#FFFFFF';
          ctx.font = '900 32px Inter';
          ctx.textAlign = 'center';
          ctx.fillText(item.tag, 950, cy + 82);

          ctx.fillStyle = isLight ? '#0F172A' : '#F8FAFC';
          ctx.font = '700 29px Cairo';
          ctx.textAlign = 'right';
          wrapArabicText(ctx, item.text, 885, cy + 75, 790, 50);
        });
      }

      // Bottom Engagement Question Pill
      drawRoundedRect(ctx, 60, 1135, 960, 95, 47, '#13203A', '#E87722', 2);
      ctx.fillStyle = '#FBBF24';
      ctx.font = '800 25px Cairo';
      ctx.textAlign = 'center';
      ctx.fillText('💬 ' + cta, 540, 1192);

      // Footer
      ctx.fillStyle = isLight ? '#334155' : '#94A3B8';
      ctx.font = '700 22px Cairo';
      ctx.textAlign = 'right';
      ctx.fillText('م. عبدالمجيد الفقيه | مهندس مدني — صناعة الأثر لا مجرد الإنجاز', 1020, 1295);
      ctx.textAlign = 'left';
      ctx.fillText('@Engineering540 |[رقم التواصل محذوف]', 60, 1295);
    }

    document.getElementById('renderBtn').addEventListener('click', renderSlide);
    document.getElementById('archetypeSelect').addEventListener('change', renderSlide);
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'E540_v2_Slide.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    window.onload = () => {
      document.fonts.ready.then(renderSlide);
    };
  </script>
</body>
</html>
